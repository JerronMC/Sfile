<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoFILES - Secure File Sharing</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- CSS is now injected directly here -->
    <style>
        :root {
            var(--primary): #3b82f6;
            --primary-gradient: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            --bg-base: #09090b;
            --card-bg: rgba(24, 24, 27, 0.6);
            --text-main: #f8fafc;
            --text-muted: #a1a1aa;
            --danger: #ef4444;
            --border: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.1);
            --radius-lg: 24px;
            --radius-md: 12px;
            --shadow-glow: 0 0 20px rgba(59, 130, 246, 0.4);
            --shadow-card: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', system-ui, sans-serif; }

        body { 
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.15) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            line-height: 1.5;
        }

        /* THIS FIXES THE OVERLAP ISSUE */
        .hidden { display: none !important; }

        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 1.2rem 5%; 
            background: rgba(9, 9, 11, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 100;
        }

        .logo { 
            font-size: 1.5rem; font-weight: 800; 
            background: var(--primary-gradient);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            cursor: pointer; display: flex; align-items: center; gap: 8px;
            transition: var(--transition);
        }
        .logo i { -webkit-text-fill-color: #3b82f6; }
        .logo:hover { transform: scale(1.05); }

        #user-info { display: flex; align-items: center; gap: 12px; }
        #user-avatar { 
            width: 40px; height: 40px; border-radius: 50%; 
            border: 2px solid var(--primary); box-shadow: var(--shadow-glow);
        }
        #user-name { font-weight: 600; letter-spacing: 0.5px; }

        button { 
            cursor: pointer; border-radius: var(--radius-md); font-weight: 600; 
            padding: 0.75rem 1.5rem; transition: var(--transition); border: none; 
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        }
        button:active { transform: scale(0.95); }

        .btn-primary { background: var(--primary-gradient); color: white; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3); }
        .btn-primary:hover { box-shadow: var(--shadow-glow); transform: translateY(-2px); }
        .btn-outline { background: rgba(255,255,255,0.03); border: 1px solid var(--border); color: var(--text-main); backdrop-filter: blur(4px); }
        .btn-outline:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.3); }
        .btn-large { width: 100%; padding: 1.2rem; font-size: 1.1rem; margin-top: 1.5rem; border-radius: 16px; }
        .btn-text { background: transparent; border: none; padding: 0.5rem; }
        .text-danger { color: var(--danger); }
        .text-danger:hover { background: rgba(239, 68, 68, 0.1); border-radius: 8px; }

        .container { max-width: 850px; margin: 3rem auto; padding: 0 1.5rem; }

        .upload-card, .download-card, .comments-section {
            background: var(--card-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border-radius: var(--radius-lg); padding: 2.5rem; text-align: center; 
            border: 1px solid var(--glass-border); box-shadow: var(--shadow-card);
            animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .upload-card p, .download-card p { color: var(--text-muted); margin-top: 8px; }

        .upload-zone {
            border: 2px dashed rgba(59, 130, 246, 0.5); border-radius: 16px; padding: 4rem 2rem;
            margin: 2rem 0; cursor: pointer; transition: var(--transition);
            background: rgba(59, 130, 246, 0.02); position: relative; overflow: hidden;
        }
        .upload-zone::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: var(--primary-gradient); opacity: 0; transition: var(--transition); z-index: -1;
        }
        .upload-zone:hover { border-color: var(--primary); transform: translateY(-5px); box-shadow: var(--shadow-glow); }
        .upload-zone:hover i { transform: scale(1.1) translateY(-5px); color: #fff; }
        .upload-zone i { font-size: 4rem; color: var(--primary); margin-bottom: 1rem; transition: var(--transition); display: inline-block; }

        .progress-bar { width: 100%; height: 12px; background: rgba(0,0,0,0.3); border-radius: 6px; overflow: hidden; margin: 1.5rem 0 0.5rem; border: 1px solid var(--border); }
        .progress-fill { height: 100%; width: 0%; background: var(--primary-gradient); transition: width 0.3s ease-out; position: relative; }
        .progress-fill::after {
            content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            animation: shimmer 1.5s infinite linear;
        }

        .link-box, .comment-input-area { display: flex; gap: 0.5rem; margin-top: 1.5rem; }
        input { 
            flex: 1; padding: 1rem; border-radius: var(--radius-md); border: 1px solid var(--border); 
            background: rgba(0, 0, 0, 0.2); color: white; outline: none; font-size: 1rem; transition: var(--transition);
        }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2); }

        .file-header { display: flex; align-items: center; gap: 1.5rem; text-align: left; margin-bottom: 2rem; background: rgba(0,0,0,0.2); padding: 1.5rem; border-radius: 16px; border: 1px solid var(--border); }
        .file-icon { font-size: 3.5rem; background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .file-details h2 { word-break: break-all; font-size: 1.5rem; font-weight: 700; }
        .file-details p span { color: var(--primary); font-weight: 600; }

        .file-interactions { display: flex; justify-content: space-between; align-items: center; margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--border); }
        .rating i { color: #52525b; cursor: pointer; margin-left: 5px; font-size: 1.2rem; transition: var(--transition); }
        .rating i:hover, .rating i.active { color: #fbbf24; transform: scale(1.2); }

        .spinner { 
            width: 60px; height: 60px; border: 4px solid rgba(255, 255, 255, 0.05); 
            border-top: 4px solid var(--primary); border-right: 4px solid #8b5cf6; border-radius: 50%; 
            animation: spin 1s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite; margin: 0 auto 1.5rem; box-shadow: 0 0 20px rgba(59, 130, 246, 0.2);
        }

        .comments-section { margin-top: 2rem; padding: 2rem; }
        .comments-section h3 { text-align: left; margin-bottom: 1rem; }
        .comment-box { padding: 1.5rem 0; border-bottom: 1px solid var(--border); display: flex; gap: 15px; text-align: left; animation: fadeIn 0.4s ease-out; }
        .comment-box:last-child { border: none; }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
        @keyframes slideUp { 0% { opacity: 0; transform: translateY(20px); } 100% { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }

        @media (max-width: 600px) {
            .container { margin: 1.5rem auto; padding: 0 1rem; }
            .upload-card, .download-card { padding: 1.5rem; }
            .action-buttons { display: flex; flex-direction: column; gap: 1rem; }
            .file-interactions { flex-direction: column; gap: 1.5rem; }
            .file-header { flex-direction: column; text-align: center; }
            .btn-large { font-size: 1rem; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo" onclick="window.location.href='?'">
            <i class="fas fa-cloud-upload-alt"></i> RoFILES
        </div>
        <div class="nav-actions">
            <div id="user-info" class="hidden">
                <img id="user-avatar" src="" alt="Avatar">
                <span id="user-name"></span>
                <button id="logout-btn" class="btn-outline">Logout</button>
            </div>
            <button id="login-btn" class="btn-primary">Login with Google</button>
        </div>
    </nav>

    <main class="container">
        <!-- HOME / UPLOAD VIEW -->
        <section id="home-view" class="view-section active">
            <div class="upload-card">
                <h2>Upload & Share Files</h2>
                <p>Secure, fast, and real uploads that never disappear.</p>
                <div class="upload-zone" id="upload-zone">
                    <i class="fas fa-file-upload"></i>
                    <p>Click to browse or drag file here</p>
                    <input type="file" id="file-input" hidden>
                </div>
                <div id="upload-progress-container" class="hidden">
                    <div class="progress-bar">
                        <div id="upload-progress" class="progress-fill"></div>
                    </div>
                    <p id="upload-status">Uploading... 0%</p>
                </div>
                <div id="share-link-container" class="hidden">
                    <p>Your file is ready! Share this link:</p>
                    <div class="link-box">
                        <input type="text" id="share-link" readonly>
                        <button id="copy-btn"><i class="fas fa-copy"></i></button>
                    </div>
                </div>
            </div>
        </section>

        <!-- DOWNLOAD VIEW -->
        <section id="download-view" class="view-section hidden">
            <div class="download-card">
                <div id="scan-stage" class="stage-active">
                    <div class="spinner"></div>
                    <h3>Scanning file for risks...</h3>
                    <p>Please wait while we verify this file.</p>
                </div>

                <div id="ready-stage" class="hidden">
                    <div class="file-header">
                        <i class="fas fa-file-archive file-icon"></i>
                        <div class="file-details">
                            <h2 id="dl-filename">Loading...</h2>
                            <p>Uploaded by <span id="dl-uploader">...</span> • <span id="dl-size">0 MB</span></p>
                        </div>
                    </div>
                    
                    <div class="action-buttons">
                        <button id="download-btn" class="btn-primary btn-large">
                            <i class="fas fa-download"></i> Download File
                        </button>
                        <button id="share-friend-btn" class="btn-outline">
                            <i class="fas fa-share"></i> Share
                        </button>
                    </div>

                    <div class="file-interactions">
                        <div class="rating">
                            <span>Rate:</span>
                            <i class="far fa-star"></i><i class="far fa-star"></i><i class="far fa-star"></i><i class="far fa-star"></i><i class="far fa-star"></i>
                        </div>
                        <button class="btn-text text-danger"><i class="fas fa-flag"></i> Report</button>
                    </div>
                </div>
            </div>

            <div class="comments-section hidden" id="comments-section">
                <h3>Comments</h3>
                <div class="comment-input-area">
                    <input type="text" id="comment-input" placeholder="Add a public comment...">
                    <button id="post-comment-btn" class="btn-primary">Post</button>
                </div>
                <div id="comments-list" class="comments-list">
                    <!-- Comments injected here -->
                </div>
            </div>
        </section>
    </main>

    <!-- JS is now injected directly here -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, doc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-storage.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        // Initialize Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBMkSFOZbUslPjkKvb-EuK6b6j061YBlEc",
            authDomain: "rofiles-8f18b.firebaseapp.com",
            projectId: "rofiles-8f18b",
            storageBucket: "rofiles-8f18b.firebasestorage.app",
            messagingSenderId: "1064806633405",
            appId: "1:1064806633405:web:73af954f1b9db8d4728cd4",
            measurementId: "G-PTWMX0NH9M"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        // DOM Elements
        const loginBtn = document.getElementById('login-btn');
        const logoutBtn = document.getElementById('logout-btn');
        const userInfo = document.getElementById('user-info');
        const uploadZone = document.getElementById('upload-zone');
        const fileInput = document.getElementById('file-input');
        const homeView = document.getElementById('home-view');
        const downloadView = document.getElementById('download-view');

        let currentUser = null;

        // 1. Authentication
        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user) {
                loginBtn.classList.add('hidden');
                userInfo.classList.remove('hidden');
                document.getElementById('user-name').textContent = user.displayName;
                document.getElementById('user-avatar').src = user.photoURL;
            } else {
                loginBtn.classList.remove('hidden');
                userInfo.classList.add('hidden');
            }
        });

        loginBtn.addEventListener('click', () => signInWithPopup(auth, provider));
        logoutBtn.addEventListener('click', () => signOut(auth));

        // 2. Routing Logic (Read ?f= parameter)
        const urlParams = new URLSearchParams(window.location.search);
        const fileId = urlParams.get('f');

        if (fileId) {
            homeView.classList.add('hidden');
            downloadView.classList.remove('hidden');
            loadFileData(fileId);
        } else {
            homeView.classList.remove('hidden');
            downloadView.classList.add('hidden');
        }

        // 3. Upload System
        uploadZone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', handleUpload);

        async function handleUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            if (!currentUser) return alert("Please login to upload files.");

            document.getElementById('upload-progress-container').classList.remove('hidden');
            const storageRef = ref(storage, `uploads/${Date.now()}_${file.name}`);
            const uploadTask = uploadBytesResumable(storageRef, file);

            uploadTask.on('state_changed', 
                (snapshot) => {
                    const progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
                    document.getElementById('upload-progress').style.width = progress + '%';
                    document.getElementById('upload-status').textContent = `Uploading... ${Math.round(progress)}%`;
                }, 
                (error) => { alert("Upload failed: " + error.message); }, 
                async () => {
                    const downloadURL = await getDownloadURL(uploadTask.snapshot.ref);
                    
                    const docRef = await addDoc(collection(db, "files"), {
                        name: file.name,
                        size: (file.size / (1024 * 1024)).toFixed(2),
                        url: downloadURL,
                        uploaderName: currentUser.displayName,
                        uploaderId: currentUser.uid,
                        timestamp: serverTimestamp(),
                        downloads: 0
                    });

                    document.getElementById('upload-progress-container').classList.add('hidden');
                    document.getElementById('share-link-container').classList.remove('hidden');
                    
                    const shareUrl = `${window.location.origin}${window.location.pathname}?f=${docRef.id}`;
                    document.getElementById('share-link').value = shareUrl;
                }
            );
        }

        document.getElementById('copy-btn').addEventListener('click', () => {
            const linkInput = document.getElementById('share-link');
            linkInput.select();
            document.execCommand('copy');
            alert("Link copied to clipboard!");
        });

        // 4. Download System
        async function loadFileData(id) {
            try {
                const fileDoc = await getDoc(doc(db, "files", id));
                if (fileDoc.exists()) {
                    const data = fileDoc.data();
                    
                    setTimeout(() => {
                        document.getElementById('scan-stage').classList.add('hidden');
                        document.getElementById('ready-stage').classList.remove('hidden');
                        document.getElementById('comments-section').classList.remove('hidden');
                        
                        document.getElementById('dl-filename').textContent = data.name;
                        document.getElementById('dl-uploader').textContent = data.uploaderName;
                        document.getElementById('dl-size').textContent = `${data.size} MB`;
                        
                        document.getElementById('download-btn').onclick = () => { window.open(data.url, '_blank'); };
                        document.getElementById('share-friend-btn').onclick = () => {
                            navigator.clipboard.writeText(window.location.href);
                            alert("Link copied! Share it with your friends.");
                        };
                    }, 2500);
                } else {
                    document.getElementById('scan-stage').innerHTML = "<h3>File not found or has been removed.</h3>";
                }
            } catch (error) {
                document.getElementById('scan-stage').innerHTML = "<h3>Error loading file.</h3>";
            }
        }
    </script>
</body>
</html>
